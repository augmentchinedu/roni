name: Build Roni

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # ── Bundle once ───────────────────────────────────────────────────────────
  bundle:
    name: Bundle kernel + compositor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build compositor
      - run: npx rollup -c rollup.config.mjs
      - run: ls -lh bundle.cjs compositor/dist/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: bundle.cjs
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: compositor-dist
          path: compositor/dist/
          retention-days: 1

  # ── Linux ─────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with: { name: bundle, path: . }
      - uses: actions/download-artifact@v4
        with: { name: compositor-dist, path: compositor/dist/ }

      - name: Build SEA (objcopy method — no postject)
        run: |
          node --experimental-sea-config sea-config.json
          mkdir -p dist
          cp $(which node) dist/roni
          chmod +x dist/roni
          # objcopy is available on all ubuntu-latest runners
          objcopy \
            --add-section NODE_SEA_BLOB=sea-prep.blob \
            --set-section-flags NODE_SEA_BLOB=noload,readonly \
            dist/roni
          # Flip the fuse byte so Node knows a blob is injected
          node -e "
            const fs = require('fs');
            const FUSE = 'NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2';
            const buf = fs.readFileSync('dist/roni');
            const idx = buf.indexOf(FUSE);
            if (idx === -1) { console.error('Fuse not found'); process.exit(1); }
            buf[idx + FUSE.length] = 49; // ASCII '1'
            fs.writeFileSync('dist/roni', buf);
            console.log('Fuse enabled at 0x' + idx.toString(16));
          "

      - name: Assemble
        run: |
          mkdir -p release/roni-linux
          cp dist/roni              release/roni-linux/roni
          cp -r compositor/dist     release/roni-linux/compositor/
          cp -r config              release/roni-linux/config/
          [ -d assets ] && cp -r assets release/roni-linux/ || true
          tar -czf roni-linux.tar.gz -C release roni-linux
          ls -lh roni-linux.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: roni-linux
          path: roni-linux.tar.gz

  # ── Windows ───────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    needs: bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with: { name: bundle, path: . }
      - uses: actions/download-artifact@v4
        with: { name: compositor-dist, path: compositor/dist/ }

      - name: Build SEA (PowerShell resource injection)
        shell: pwsh
        run: |
          node --experimental-sea-config sea-config.json
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $nodePath = (Get-Command node).Source
          Copy-Item $nodePath dist\roni.exe

          # Write injection script to a file (PowerShell has no heredoc)
          @'
          import { readFileSync, writeFileSync } from "node:fs";
          const FUSE = "NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2";
          const binary = readFileSync("dist/roni.exe");
          const blob = readFileSync("sea-prep.blob");
          const fuseIdx = binary.indexOf(Buffer.from(FUSE));
          if (fuseIdx === -1) { console.error("Fuse not found"); process.exit(1); }
          const lenBuf = Buffer.alloc(4);
          lenBuf.writeUInt32LE(blob.length, 0);
          const result = Buffer.concat([binary, lenBuf, blob]);
          result[fuseIdx + FUSE.length] = 49;
          writeFileSync("dist/roni.exe", result);
          console.log("SEA blob injected, fuse enabled at 0x" + fuseIdx.toString(16));
          '@ | Out-File -FilePath inject.mjs -Encoding UTF8

          node inject.mjs

      - name: Assemble
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\roni-windows | Out-Null
          Copy-Item dist\roni.exe            release\roni-windows\roni.exe
          Copy-Item -Recurse compositor\dist release\roni-windows\compositor\
          Copy-Item -Recurse config          release\roni-windows\config\
          if (Test-Path assets) { Copy-Item -Recurse assets release\roni-windows\ }
          Compress-Archive -Path release\roni-windows\* -DestinationPath roni-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: roni-windows
          path: roni-windows.zip

  # ── macOS ─────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS
    needs: bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with: { name: bundle, path: . }
      - uses: actions/download-artifact@v4
        with: { name: compositor-dist, path: compositor/dist/ }

      - name: Build SEA (llvm-objcopy / Mach-O section injection)
        run: |
          node --experimental-sea-config sea-config.json
          mkdir -p dist
          cp $(which node) dist/roni
          codesign --remove-signature dist/roni || true

          # Use llvm-objcopy to add Mach-O section (available on macos-latest)
          if command -v llvm-objcopy &>/dev/null; then
            llvm-objcopy \
              --add-section __NODE_SEA,__blob=sea-prep.blob \
              dist/roni
          else
            # Fallback: use ld to add section
            ld -sectcreate __NODE_SEA __blob sea-prep.blob \
               -o dist/roni dist/roni || true
          fi

          # Flip fuse
          node -e "
            const fs = require('fs');
            const FUSE = 'NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2';
            const buf = fs.readFileSync('dist/roni');
            const idx = buf.indexOf(FUSE);
            if (idx === -1) { console.error('Fuse not found'); process.exit(1); }
            buf[idx + FUSE.length] = 49;
            fs.writeFileSync('dist/roni', buf);
            console.log('Fuse enabled at 0x' + idx.toString(16));
          "
          codesign --sign - dist/roni || true

      - name: Assemble
        run: |
          mkdir -p release/roni-macos
          cp dist/roni              release/roni-macos/roni
          cp -r compositor/dist     release/roni-macos/compositor/
          cp -r config              release/roni-macos/config/
          [ -d assets ] && cp -r assets release/roni-macos/ || true
          chmod +x release/roni-macos/roni
          tar -czf roni-macos.tar.gz -C release roni-macos

      - uses: actions/upload-artifact@v4
        with:
          name: roni-macos
          path: roni-macos.tar.gz

  # ── Release ───────────────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - run: find artifacts/ -type f -ls

      - uses: softprops/action-gh-release@v2
        with:
          name: Roni ${{ github.ref_name }}
          body: |
            ## Roni OS ${{ github.ref_name }}

            | Platform | Download | Instructions |
            |----------|----------|--------------|
            | Windows  | `roni-windows.zip` | Extract, run `roni.exe` |
            | Linux    | `roni-linux.tar.gz` | Extract, `chmod +x roni`, run `./roni` |
            | macOS    | `roni-macos.tar.gz` | Extract, `chmod +x roni`, run `./roni` |

            **Requires:** Chrome or Chromium (auto-detected). Keep `compositor/` and `config/` next to the binary.
          files: |
            artifacts/roni-linux/roni-linux.tar.gz
            artifacts/roni-windows/roni-windows.zip
            artifacts/roni-macos/roni-macos.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}