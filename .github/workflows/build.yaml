name: Build Roni SEA Binaries

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Step 1: Bundle JS once
  bundle:
    runs-on: ubuntu-latest
    outputs:
      bundle-path: ${{ steps.bundle.outputs.bundle }}
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '25'

      - name: Install dependencies
        run: npm ci

      - name: Bundle with Rollup
        id: bundle
        run: |
          npm run bundle
          echo "bundle=${GITHUB_WORKSPACE}/bundle.js" >> $GITHUB_OUTPUT

  # Build Linux binary
  build-linux:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '25'

      - name: Ensure dist folder exists
        run: mkdir -p dist

      - name: Build Linux SEA
        run: |
          echo "{
            \"main\": \"bundle.js\",
            \"output\": \"dist/roni-linux\",
            \"nodeExecutable\": \"$(which node)\"
          }" > sea-config-linux.json
          node --build-sea sea-config-linux.json

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: roni-linux
          path: dist/roni-linux

  # Build Windows binary
  build-windows:
    needs: bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '25'

      - name: Ensure dist folder exists
        run: mkdir dist

      - name: Build Windows SEA
        shell: pwsh
        run: |
          @"
          {
            "main": "bundle.js",
            "output": "dist/roni.exe",
            "nodeExecutable": "C:\\hostedtoolcache\\windows\\node\\25.6.1\\x64\\node.exe"
          }
          "@ | Out-File -FilePath sea-config-windows.json -Encoding UTF8
          node --build-sea sea-config-windows.json

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: roni-win
          path: dist/roni.exe

  # Build macOS binary
  build-macos:
    needs: bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '25'

      - name: Ensure dist folder exists
        run: mkdir -p dist

      - name: Build macOS SEA
        run: |
          echo "{
            \"main\": \"bundle.js\",
            \"output\": \"dist/roni-macos\",
            \"nodeExecutable\": \"$(which node)\"
          }" > sea-config-macos.json
          node --build-sea sea-config-macos.json

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: roni-macos
          path: dist/roni-macos