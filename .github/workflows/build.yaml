name: Build Roni SEA Binaries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 25

      - run: npm ci
      - run: npm run bundle

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: bundle.js

  build-linux:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/download-artifact@v4
        with:
          name: bundle

      - run: mkdir -p dist

      - name: Download standalone Node
        run: |
          curl -fsSL https://nodejs.org/dist/v25.6.1/node-v25.6.1-linux-x64.tar.xz -o node.tar.xz
          tar -xf node.tar.xz
          mv node-v25.6.1-linux-x64/bin/node node-bin  # binary lives under bin/
          chmod +x node-bin

      - name: Build Linux SEA
        run: |
          cat > sea.json <<EOF
          {
            "main": "bundle.js",
            "output": "dist/roni-linux",
            "nodeExecutable": "$PWD/node-bin"
          }
          EOF
          ./node-bin --build-sea sea.json

      - uses: actions/upload-artifact@v4
        with:
          name: roni-linux
          path: dist/roni-linux

  build-windows:
    needs: bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 25

      - uses: actions/download-artifact@v4
        with:
          name: bundle

      - run: mkdir dist

      - name: Build Windows SEA
        shell: pwsh
        run: |
          # Copy node.exe first — --build-sea modifies the executable in-place
          $nodeSrc = (Get-Command node).Source
          Copy-Item $nodeSrc dist\roni.exe

          @"
          {
            "main": "bundle.js",
            "output": "dist/roni.exe",
            "nodeExecutable": "dist/roni.exe"
          }
          "@ | Out-File sea.json -Encoding UTF8

          node --build-sea sea.json

      - uses: actions/upload-artifact@v4
        with:
          name: roni-win
          path: dist/roni.exe

  build-macos:
    needs: bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/download-artifact@v4
        with:
          name: bundle

      - run: mkdir -p dist

      - name: Download standalone Node
        run: |
          # macos-latest runners are ARM64
          curl -fsSL https://nodejs.org/dist/v25.6.1/node-v25.6.1-darwin-arm64.tar.gz -o node.tar.gz
          tar -xf node.tar.gz
          mv node-v25.6.1-darwin-arm64/bin/node node-bin  # binary lives under bin/
          chmod +x node-bin

      - name: Build macOS SEA
        run: |
          cat > sea.json <<EOF
          {
            "main": "bundle.js",
            "output": "dist/roni-macos",
            "nodeExecutable": "$PWD/node-bin"
          }
          EOF
          ./node-bin --build-sea sea.json

      - uses: actions/upload-artifact@v4
        with:
          name: roni-macos
          path: dist/roni-macos