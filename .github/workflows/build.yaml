name: Build Roni SEA Binaries

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Install Node 25
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '25'

      # Install dependencies
      - run: npm ci

      # Bundle ESM code with Rollup
      - name: Bundle with Rollup
        run: npm run bundle

      # Build Linux SEA binary
      - name: Build Linux SEA
        run: node --build-sea sea-config-linux.json
        working-directory: ${{ github.workspace }}

      # Upload artifact
      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: roni-linux
          path: dist/roni-linux

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '25'

      - run: npm ci

      - name: Bundle with Rollup
        run: npm run bundle

      - name: Build Windows SEA
        run: node --build-sea sea-config-windows.json
        working-directory: ${{ github.workspace }}

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: roni-win
          path: dist/roni.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '25'

      - run: npm ci

      - name: Bundle with Rollup
        run: npm run bundle

      - name: Build macOS SEA
        run: node --build-sea sea-config-macos.json
        working-directory: ${{ github.workspace }}

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: roni-macos
          path: dist/roni-macos