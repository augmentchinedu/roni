name: Build Roni SEA Binaries

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 25

      - run: npm ci
      - run: npm run bundle

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: bundle.js

  build-linux:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          name: bundle

      - run: mkdir -p dist

      - name: Download standalone Node
        run: |
          curl -fsSL https://nodejs.org/dist/v25.6.1/node-v25.6.1-linux-x64.tar.xz -o node.tar.xz
          tar -xf node.tar.xz
          mv node-v25.6.1-linux-x64/bin/node node-bin
          chmod +x node-bin

      - name: Build Linux SEA
        run: |
          cat > sea.json <<EOF
          {
            "main": "bundle.js",
            "output": "dist/roni-linux",
            "nodeExecutable": "$PWD/node-bin"
          }
          EOF
          ./node-bin --build-sea sea.json

      - uses: actions/upload-artifact@v4
        with:
          name: roni-linux
          path: dist/roni-linux

  build-windows:
    needs: bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 25
      - uses: actions/download-artifact@v4
        with:
          name: bundle

      - run: mkdir dist

      - name: Build Windows SEA
        shell: pwsh
        run: |
          $nodeSrc = (Get-Command node).Source
          Copy-Item $nodeSrc dist\roni.exe

          @"
          {
            "main": "bundle.js",
            "output": "dist/roni.exe",
            "nodeExecutable": "dist/roni.exe"
          }
          "@ | Out-File sea.json -Encoding UTF8

          node --build-sea sea.json

      - uses: actions/upload-artifact@v4
        with:
          name: roni-win
          path: dist/roni.exe

  build-macos:
    needs: bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          name: bundle

      - run: mkdir -p dist

      - name: Download standalone Node
        run: |
          curl -fsSL https://nodejs.org/dist/v25.6.1/node-v25.6.1-darwin-arm64.tar.gz -o node.tar.gz
          tar -xf node.tar.gz
          mv node-v25.6.1-darwin-arm64/bin/node node-bin
          chmod +x node-bin

      - name: Build macOS SEA
        run: |
          cat > sea.json <<EOF
          {
            "main": "bundle.js",
            "output": "dist/roni-macos",
            "nodeExecutable": "$PWD/node-bin"
          }
          EOF
          ./node-bin --build-sea sea.json

      - uses: actions/upload-artifact@v4
        with:
          name: roni-macos
          path: dist/roni-macos

  release-and-upload:
    needs: [build-linux, build-windows, build-macos]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/roni-linux/roni-linux
            artifacts/roni-win/roni.exe
            artifacts/roni-macos/roni-macos

      # Authenticate to GCP
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Upload versioned binaries to GCS
      - name: Upload to GCS
        run: |
          VERSION=${GITHUB_REF_NAME}

          gsutil cp artifacts/roni-linux/roni-linux gs://${{ secrets.GCS_BUCKET }}/$VERSION/roni-linux
          gsutil cp artifacts/roni-win/roni.exe gs://${{ secrets.GCS_BUCKET }}/$VERSION/roni.exe
          gsutil cp artifacts/roni-macos/roni-macos gs://${{ secrets.GCS_BUCKET }}/$VERSION/roni-macos