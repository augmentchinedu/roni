name: Build Roni

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # ── Bundle once, reuse across platforms ─────────────────────────────────
  bundle:
    name: Bundle kernel + compositor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build compositor
        run: npx vite build compositor

      - name: Bundle kernel
        run: npx rollup -c rollup.config.mjs

      - name: Verify
        run: ls -lh bundle.cjs compositor/dist/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: bundle.cjs
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: compositor-dist
          path: compositor/dist/
          retention-days: 1

  # ── Linux ────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with: { name: bundle, path: . }
      - uses: actions/download-artifact@v4
        with: { name: compositor-dist, path: compositor/dist/ }

      - name: Build SEA binary
        run: |
          # Generate blob
          node --experimental-sea-config sea-config.json

          # Install postject from GitHub release (bypasses npm registry policy)
          curl -fsSL https://github.com/nicolo-ribaudo/postject/releases/download/v1.0.0-alpha.5/postject-linux-x64 \
            -o /usr/local/bin/postject
          chmod +x /usr/local/bin/postject

          # Inject
          mkdir -p dist
          cp $(which node) dist/roni
          chmod +x dist/roni
          postject dist/roni NODE_SEA_BLOB sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

      - name: Assemble
        run: |
          mkdir -p release/roni-linux
          cp dist/roni              release/roni-linux/roni
          cp -r compositor/dist     release/roni-linux/compositor/
          cp -r config              release/roni-linux/config/
          [ -d assets ] && cp -r assets release/roni-linux/ || true
          chmod +x release/roni-linux/roni
          tar -czf roni-linux.tar.gz -C release roni-linux

      - uses: actions/upload-artifact@v4
        with:
          name: roni-linux
          path: roni-linux.tar.gz

  # ── Windows ──────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    needs: bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with: { name: bundle, path: . }
      - uses: actions/download-artifact@v4
        with: { name: compositor-dist, path: compositor/dist/ }

      - name: Build SEA binary
        shell: pwsh
        run: |
          # Generate blob
          node --experimental-sea-config sea-config.json

          # Download postject binary from GitHub releases
          $url = "https://github.com/nicolo-ribaudo/postject/releases/download/v1.0.0-alpha.5/postject-win32-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile postject.exe

          # Inject
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $nodePath = (Get-Command node).Source
          Copy-Item $nodePath dist\roni.exe
          .\postject.exe dist\roni.exe NODE_SEA_BLOB sea-prep.blob `
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

      - name: Assemble
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\roni-windows | Out-Null
          Copy-Item dist\roni.exe            release\roni-windows\roni.exe
          Copy-Item -Recurse compositor\dist release\roni-windows\compositor\
          Copy-Item -Recurse config          release\roni-windows\config\
          if (Test-Path assets) { Copy-Item -Recurse assets release\roni-windows\ }
          Compress-Archive -Path release\roni-windows\* -DestinationPath roni-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: roni-windows
          path: roni-windows.zip

  # ── macOS ────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS
    needs: bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with: { name: bundle, path: . }
      - uses: actions/download-artifact@v4
        with: { name: compositor-dist, path: compositor/dist/ }

      - name: Build SEA binary
        run: |
          # Generate blob
          node --experimental-sea-config sea-config.json

          # Download postject binary from GitHub releases
          curl -fsSL https://github.com/nicolo-ribaudo/postject/releases/download/v1.0.0-alpha.5/postject-darwin-x64 \
            -o /usr/local/bin/postject
          chmod +x /usr/local/bin/postject

          # Inject
          mkdir -p dist
          cp $(which node) dist/roni
          codesign --remove-signature dist/roni || true
          postject dist/roni NODE_SEA_BLOB sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 \
            --macho-segment-name NODE_SEA
          codesign --sign - dist/roni || true

      - name: Assemble
        run: |
          mkdir -p release/roni-macos
          cp dist/roni              release/roni-macos/roni
          cp -r compositor/dist     release/roni-macos/compositor/
          cp -r config              release/roni-macos/config/
          [ -d assets ] && cp -r assets release/roni-macos/ || true
          chmod +x release/roni-macos/roni
          tar -czf roni-macos.tar.gz -C release roni-macos

      - uses: actions/upload-artifact@v4
        with:
          name: roni-macos
          path: roni-macos.tar.gz

  # ── GitHub Release (on version tags) ─────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f

      - uses: softprops/action-gh-release@v2
        with:
          name: Roni ${{ github.ref_name }}
          body: |
            ## Roni OS ${{ github.ref_name }}

            | Platform | Download |
            |----------|----------|
            | Windows  | `roni-windows.zip` → extract, run `roni.exe` |
            | Linux    | `roni-linux.tar.gz` → extract, `chmod +x roni`, run `./roni` |
            | macOS    | `roni-macos.tar.gz` → extract, `chmod +x roni`, run `./roni` |

            **Requirements:** Chrome or Chromium (auto-detected). `compositor/` and `config/` folders must stay next to the binary.
          files: |
            artifacts/roni-linux/roni-linux.tar.gz
            artifacts/roni-windows/roni-windows.zip
            artifacts/roni-macos/roni-macos.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}