name: Build SEA binaries

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '25'
      - run: npm ci
      - run: npm run bundle
      - run: node --build-sea sea-congig-linux.json  # Linux SEA build
      - uses: actions/upload-artifact@v3
        with:
          name: roni-linux
          path: dist/roni-linux

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '25'
      - run: npm ci
      - run: npm run bundle
      - run: node --build-sea sea-congig-windows.json  # Windows SEA build
      - uses: actions/upload-artifact@v3
        with:
          name: roni-win
          path: dist/roni.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '25'
      - run: npm ci
      - run: npm run bundle
      - run: node --build-sea sea-congig-macos.json  # macOS SEA build
      - uses: actions/upload-artifact@v3
        with:
          name: roni-macos
          path: dist/roni-macos