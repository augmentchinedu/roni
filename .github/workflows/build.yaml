name: Build & Upload Roni

on:
  push:
    branches: [main]

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Nexe
        run: npm install -g nexe

      - name: Install build tools (if needed)
        run: sudo apt-get update && sudo apt-get install -y python3 build-essential

      - name: Build Linux executable
        run: |
          mkdir -p dist
          npx nexe src/main.js \
            -t linux-x64-22.3.0 \
            -o dist/roni-linux \
            --build

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: great-unknown

      - name: Upload Linux executable to GCS
        run: gsutil cp dist/roni-linux gs://your-bucket-name/roni-builds/roni-linux

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Nexe
        run: npm install -g nexe

      - name: Build Windows executable
        run: |
          mkdir dist
          npx nexe src/main.js `
            -t windows-x64-22.3.0 `
            -o dist/Roni.exe `
            --build

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: great-unknown

      - name: Upload Windows executable to GCS
        run: gsutil cp dist/Roni.exe gs://your-bucket-name/roni-builds/Roni-windows.exe

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Nexe
        run: npm install -g nexe

      - name: Build macOS executable
        run: |
          mkdir -p dist
          npx nexe src/main.js \
            -t macos-x64-22.3.0 \
            -o dist/Roni.app \
            --build

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: great-unknown

      - name: Upload macOS executable to GCS
        run: gsutil -m cp -r dist/Roni.app gs://your-bucket-name/roni-builds/Roni-macos