name: Build Roni

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # ── Bundle once ───────────────────────────────────────────────────────────
  bundle:
    name: Bundle kernel + compositor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npx vite build compositor
      - run: npx rollup -c rollup.config.mjs
      - run: ls -lh bundle.cjs

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: bundle.cjs
          retention-days: 1

  # ── Linux ─────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - uses: actions/download-artifact@v4
        with: { name: bundle, path: . }
      - name: Build SEA
        run: |
          mkdir -p dist
          node --build-sea sea-config.json
          chmod +x dist/roni
          ls -lh dist/roni

      - name: Assemble release
        run: |
          mkdir -p release/roni-linux
          cp dist/roni              release/roni-linux/roni
          chmod +x release/roni-linux/roni
          tar -czf roni-linux.tar.gz -C release roni-linux
          ls -lh roni-linux.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: roni-linux
          path: roni-linux.tar.gz

  # ── Windows ───────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    needs: bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - uses: actions/download-artifact@v4
        with: { name: bundle, path: . }
      - name: Build SEA
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # --build-sea on Windows outputs .exe — update config output path
          $config = Get-Content sea-config.json | ConvertFrom-Json
          $config.output = "dist/roni.exe"
          # IMPORTANT
          $config.windows = @{
            subsystem = "windows"
          }
          $config | ConvertTo-Json -Depth 5 | Out-File sea-config-win.json -Encoding UTF8
          node --build-sea sea-config-win.json
          Get-Item dist\roni.exe | Select-Object Name, Length

      - name: Assemble release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\roni-windows | Out-Null
          Copy-Item dist\roni.exe          release\roni-windows\roni.exe
          Compress-Archive -Path release\roni-windows\* -DestinationPath roni-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: roni-windows
          path: roni-windows.zip

  # ── macOS ─────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (Background App)
    needs: bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25

      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: .

      # ── Build SEA Binary ───────────────────────────────────────────────
      - name: Build SEA
        run: |
          mkdir -p dist
          node --build-sea sea-config.json
          chmod +x dist/roni
          ls -lh dist/roni

      # ── Create Minimal Background .app Wrapper ─────────────────────────
      - name: Create Background App Bundle
        run: |
          mkdir -p dist/Roni.app/Contents/MacOS

          # Move binary into app bundle
          cp dist/roni dist/Roni.app/Contents/MacOS/roni
          chmod +x dist/Roni.app/Contents/MacOS/roni

          # Create Info.plist with LSUIElement (NO Dock icon)
          cat > dist/Roni.app/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Roni</string>
              <key>CFBundleIdentifier</key>
              <string>com.roni.os</string>
              <key>CFBundleExecutable</key>
              <string>roni</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSUIElement</key>
              <true/>
          </dict>
          </plist>
          EOF

          # Optional ad-hoc sign (prevents warnings)
          codesign --force --deep --sign - dist/Roni.app || true

          ls -R dist/Roni.app

      # ── Package Release ────────────────────────────────────────────────
      - name: Assemble release
        run: |
          mkdir -p release
          cp -R dist/Roni.app release/
          tar -czf roni-macos.tar.gz -C release Roni.app
          ls -lh roni-macos.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: roni-macos
          path: roni-macos.tar.gz

  # ── Release ───────────────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - run: find artifacts/ -type f -ls

      - uses: softprops/action-gh-release@v2
        with:
          name: Roni ${{ github.ref_name }}
          body: |
            ## Roni OS ${{ github.ref_name }}

            | Platform | Download | Run |
            |----------|----------|-----|
            | Windows  | `roni-windows.zip` | Extract → `roni.exe` |
            | Linux    | `roni-linux.tar.gz` | Extract → `chmod +x roni && ./roni` |
            | macOS    | `roni-macos.tar.gz` | Extract → `chmod +x roni && ./roni` |

            **Requires:** Chrome or Chromium (auto-detected). Compositor is embedded — just run the binary.
          files: |
            artifacts/roni-linux/roni-linux.tar.gz
            artifacts/roni-windows/roni-windows.zip
            artifacts/roni-macos/roni-macos.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
