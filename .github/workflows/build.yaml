name: Build Roni & Upload

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Install pkg globally (needed to run)
      - name: Install pkg
        run: npm install -g pkg

      # 5️⃣ Build executable for current OS
      - name: Build executable
        run: |
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            pkg . --targets node22-linux-x64 --output dist/roni-linux
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            pkg . --targets node22-win-x64 --output dist/Roni.exe
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            pkg . --targets node22-macos-x64 --output dist/Roni.app
          fi

      # 6️⃣ Set up gcloud
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: your-gcp-project-id

      # 7️⃣ Upload built executable to GCS
      - name: Upload to GCS
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            gsutil cp dist/roni-linux gs://your-bucket-name/roni-builds/roni-linux
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            gsutil cp dist/Roni.exe gs://your-bucket-name/roni-builds/Roni-windows.exe
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            gsutil -m cp -r dist/Roni.app gs://your-bucket-name/roni-builds/Roni-macos
          fi